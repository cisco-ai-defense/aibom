[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cisco-aibom"
version = "1.0.8"
description = "A tool to generate an AI BOM from source code."
readme = "README.md"
requires-python = ">=3.11.4,<3.14"
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
]

dependencies = [
    "libcst>=1.0.0",
    "duckdb>=1.0.0",
    "typer>=0.9.0",
    "pandas>=2.0.0",
    "fastapi>=0.139.2",
    "starlette>=1.3.1",
    "uvicorn>=0.24.0",
    "pydantic>=2.6.0",
    "httpx>=0.28.1",
    "rich>=13.9.0",
    "platformdirs>=4.0.0",
    "pyyaml>=6.0",
    "pathspec>=0.12.0",
    "cyclonedx-python-lib>=9.0.0",
    "jinja2>=3.1.0",
    "aiofiles>=24.1.0",
]

[project.scripts]
cisco-aibom = "aibom.cli:cli_entry_point"

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=6.2.1",
    "respx>=0.22.0",
    # A small set of contract tests exercise the real optional SDK. Keep the
    # public CI's documented ``uv sync --group dev && uv run pytest`` path
    # complete instead of requiring an undeclared extra.
    "galileo==2.4.0",
    "galileo-core==4.4.0",
    "langchain-core>=1.3.3",
    "black>=26.3.1",
    "flake8>=7.0.0",
    "isort>=5.13.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.4.1",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=6.2.1",
    "respx>=0.22.0",
    "galileo==2.4.0",
    "galileo-core==4.4.0",
    "langchain-core>=1.3.3",
]
analysis = [
    "detect-secrets>=1.5.0",
    "tree-sitter>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
    "tree-sitter-java>=0.23.0",
    "tree-sitter-go>=0.23.0",
    "tree-sitter-rust>=0.23.0",
    "tree-sitter-ruby>=0.23.0",
    "tree-sitter-c-sharp>=0.23.0",
]
security = [
    # Floors raised so the transitive ``litellm`` resolves to >=1.83.7, which
    # is past the malicious 1.82.7/1.82.8 supply-chain releases and the
    # proxy-side SQL-injection / OIDC auth-bypass criticals. The AI BOM CLI
    # never runs the litellm proxy, but these floors keep dependency audits
    # clean on the ``security``/``all`` installs.
    "cisco-ai-mcp-scanner>=4.8.1",
    "cisco-ai-skill-scanner>=2.0.12",
    # Optional engine for the --atr-enrichment pass (off by default). Adds the
    # LLM-I/O / tool-call / agent-config event surface and the per-rule MITRE
    # ATLAS mappings that the bundled skill-scanner rule-pack does not expose
    # back to the BOM. Import is guarded, so absence is a no-op.
    "pyatr>=0.2.6",
]
agentic = [
    "deepagents>=0.4.12",
    "langchain>=1.2.11",
    "langchain-core>=1.3.3",
]
observability = [
    # The production sanitizer validates the exact Galileo 2.4 ingestion
    # and galileo-core 4.4.0 shapes before every flush. Widen either constraint
    # only after the new pair passes the hierarchy and privacy-contract tests.
    "galileo==2.4.0",
    "galileo-core==4.4.0",
]
llm-openai = [
    "langchain-openai>=0.3.0",
]
llm-aws = [
    "langchain-aws>=0.2.0",
]
llm-anthropic = [
    "langchain-anthropic>=0.3.0",
]
llm-google = [
    "langchain-google-genai>=2.0.0",
]
cloud = [
    "boto3>=1.35.0",
    "google-cloud-aiplatform>=1.74.0",
    "azure-identity>=1.19.0",
    "azure-mgmt-cognitiveservices>=13.6.0",
]
all = [
    "cisco-aibom[analysis,security,agentic,observability,llm-openai,llm-aws,llm-anthropic,llm-google,cloud]",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--maxfail=1 --cov=aibom"
filterwarnings = [
    "ignore:Pydantic serializer warnings:UserWarning:pydantic.*",
]
markers = [
    "integration: mark for tests that hit external services (run with -m integration)",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["aibom*"]

[tool.setuptools.package-data]
aibom = ["manifest.json"]

# Code formatting and linting configuration
[tool.black]
line-length = 88
target-version = ['py311', 'py312', 'py313']
include = '\.pyi?$'
extend-exclude = '''
# A regex preceded by ^/ will apply only to files and directories
# in the root of the project.
^/setup.py
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503", "E501"]
exclude = [".git", "__pycache__", "build", "dist", ".venv", "venv"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "deepagents",
    "deepagents.*",
    "langchain",
    "langchain.*",
    "langchain_core",
    "langchain_core.*",
    "detect_secrets",
    "detect_secrets.*",
    "tree_sitter",
    "tree_sitter_typescript",
    "tree_sitter_javascript",
    "tree_sitter_java",
    "tree_sitter_go",
    "tree_sitter_rust",
    "tree_sitter_ruby",
    "tree_sitter_c_sharp",
    "mcpscanner",
    "mcpscanner.*",
    "skill_scanner",
    "skill_scanner.*",
    "pyatr",
    "pyatr.*",
    "galileo",
    "galileo.*",
]
ignore_missing_imports = true

[tool.uv]
# uv is a fast, modern Python package manager.
# https://github.com/astral-sh/uv
