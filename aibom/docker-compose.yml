# docker-compose.yml — local dev/testing for the cisco-aibom Docker image.
# NOT for production. Images are NOT pushed from here.
#
# Usage:
#   docker compose build
#   docker compose run aibom analyze /workspace -o json -O /workspace/report.json \
#     --llm-model anthropic/claude-sonnet-4-20250514

services:
  aibom:
    build:
      context: ..
      dockerfile: aibom/Dockerfile
    volumes:
      - ${SCAN_DIR:-.}:/workspace:ro
    working_dir: /workspace
    environment:
      - ANTHROPIC_API_KEY
      - OPENAI_API_KEY
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_SESSION_TOKEN
      - AWS_DEFAULT_REGION
      - AZURE_OPENAI_API_KEY
      - AZURE_OPENAI_ENDPOINT
